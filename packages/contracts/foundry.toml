[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 4

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
arc_testnet = "${ARC_RPC_HTTP}"

# testnet.arcscan.app is a Blockscout instance, not Etherscan.
# Foundry reads this block when --verify is passed; combine with
# `--verifier blockscout` at the CLI so forge speaks Blockscout's API.
# The "key" field is required by Foundry but ignored by Blockscout.
[etherscan]
arc_testnet = { key = "blockscout-no-key-needed", url = "https://testnet.arcscan.app/api/", chain = 5042002 }
